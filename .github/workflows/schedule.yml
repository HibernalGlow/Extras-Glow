on:
  workflow_dispatch:
  schedule:
    # Run once a week (Monday 00:20 UTC)
    - cron: "20 0 * * 1"
  repository_dispatch:
    types: [neoview-release]
name: Excavator
jobs:
  excavate:
    name: Excavate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@main
      - name: Excavate
        uses: ScoopInstaller/GithubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SKIP_UPDATED: "1"
